  <style>

    .hub-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .cards-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      width: 100%;
      max-width: 800px;
      margin-top: 2rem;
    }

    .portal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      text-decoration: none;
      color: var(--text-primary);
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .portal-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: var(--shadow-hover);
    }

    .portal-icon {
      font-size: 3rem;
      line-height: 1;
    }

    .portal-card h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .portal-card h2::after {
      content: '.';
      color: var(--primary);
    }

    .portal-card p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .btn-portal {
      margin-top: 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.25rem;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .portal-card:hover .btn-portal {
      background: var(--primary);
      color: #ffffff;
    }
  </style>
</head>
